<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>milk</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family: "Microsoft Yahei", sans-serif;
            background: #f5f5f5;
            padding: 10px;
        }
        .origin-page{
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
            background: #fff;
        }
        .config-box{
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 5px #ddd;
            margin-bottom: 15px;
        }
        .config-item{
            margin: 8px 0;
        }
        input,textarea,button{
            padding: 6px;
            font-size: 14px;
        }
        textarea{
            width: 100%;
            height: 80px;
            resize: vertical;
        }
        .role-list{
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
        }
        .role-tag{
            background: #e1f5fe;
            padding: 4px 10px;
            border-radius: 15px;
        }
        .chat-box{
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
            border: 1px solid #eee;
        }
        .msg-item{
            margin: 6px 0;
            line-height: 1.6;
        }
        .my-msg{color: #2196F3;}
        .other-msg{color: #4CAF50;}
        .letter-item{
            background: #fff8e1;
            padding: 8px;
            border-radius: 4px;
            margin: 8px 0;
            border-left: 4px solid #ffc107;
        }
        .send-box{
            display: flex;
            gap: 8px;
            align-items: center;
        }
        #sendInput{flex: 1;}
        #imgUpload{display: none;}
        .btn{
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: #607d8b;
            color: #fff;
        }
        .clear-btn{
            background: #f44336;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="origin-page">
        <!-- 在这里粘贴原网站所有内容 -->
        <h2>原有页面内容区域</h2>
        <p>请将原网站图文、元素全部粘贴在此处</p>
    </div>

    <div class="config-box">
        <h3>⚙️ 全局设置（自动保存）</h3>
        <div class="config-item">
            消息触发概率(0-100)：<input type="number" id="msgRate" min="0" max="100"> %
        </div>
        <div class="config-item">
            写信触发概率(0-100)：<input type="number" id="letterRate" min="0" max="100"> %
        </div>
        <div class="config-item">
            图片转发概率(0-100)：<input type="number" id="imgRate" min="0" max="100"> %
        </div>
        <div class="config-item">
            最大发送间隔(毫秒)：<input type="number" id="maxTime">
        </div>
        <div class="config-item">
            单次最大连发条数：<input type="number" id="maxMsgNum" min="1">
        </div>

        <div class="config-item">
            <h4>📝 字卡库（自动保存，一行一条）</h4>
            <textarea id="wordCard" placeholder="导入字卡，每行一条话术"></textarea>
        </div>

        <div class="config-item">
            <h4>👤 角色管理（自动保存）</h4>
            <div class="role-list" id="roleView"></div>
            <input type="text" id="newRole" placeholder="输入角色名">
            <button class="btn" onclick="addRole()">添加角色</button>
        </div>

        <button class="btn clear-btn" onclick="clearAllRecord()">清空全部聊天记录</button>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="send-box">
        <input type="text" id="sendInput" placeholder="输入消息发送...">
        <button class="btn" onclick="sendText()">发送文字</button>
        <label class="btn" for="imgUpload">选择图片</label>
        <input type="file" id="imgUpload" accept="image/*" onchange="sendImg(this)">
    </div>

<script>
const STORAGE_KEY = "milk_chat_data";
let roleList = [];
let chatRecord = [];
let timer = null;
let lastImg = "";

window.onload = function(){
    initData();
    bindInputSave();
    renderRole();
    renderChat();
    startAutoTalk();
}

function initData(){
    let localData = localStorage.getItem(STORAGE_KEY);
    let defaultData = {
        msgRate: 60,
        letterRate: 15,
        imgRate: 40,
        maxTime: 5000,
        maxMsgNum: 3,
        wordCard: "早安~\n今天天气不错哦\n在吗？\n有空聊聊吗\n收到啦\n哈哈哈哈\n原来是这样\n我也这么觉得",
        roles: ["角色A","角色B"],
        records: []
    };

    let data = localData ? JSON.parse(localData) : defaultData;
    roleList = data.roles;
    chatRecord = data.records;

    document.getElementById("msgRate").value = data.msgRate;
    document.getElementById("letterRate").value = data.letterRate;
    document.getElementById("imgRate").value = data.imgRate;
    document.getElementById("maxTime").value = data.maxTime;
    document.getElementById("maxMsgNum").value = data.maxMsgNum;
    document.getElementById("wordCard").value = data.wordCard;
}

function saveData(){
    let saveObj = {
        msgRate: Number(document.getElementById("msgRate").value) || 60,
        letterRate: Number(document.getElementById("letterRate").value) || 15,
        imgRate: Number(document.getElementById("imgRate").value) || 40,
        maxTime: Number(document.getElementById("maxTime").value) || 5000,
        maxMsgNum: Number(document.getElementById("maxMsgNum").value) || 3,
        wordCard: document.getElementById("wordCard").value,
        roles: roleList,
        records: chatRecord
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(saveObj));
}

function bindInputSave(){
    const inputs = ["msgRate","letterRate","imgRate","maxTime","maxMsgNum","wordCard"];
    inputs.forEach(id=>{
        document.getElementById(id).addEventListener("input", saveData);
    });
}

function renderRole(){
    let html = "";
    roleList.forEach((item,idx)=>{
        html += `<span class="role-tag">${item} <button onclick="delRole(${idx})">×</button></span>`;
    })
    document.getElementById("roleView").innerHTML = html;
}

function addRole(){
    let name = document.getElementById("newRole").value.trim();
    if(name){
        roleList.push(name);
        document.getElementById("newRole").value = "";
        renderRole();
        saveData();
    }
}

function delRole(idx){
    roleList.splice(idx,1);
    renderRole();
    saveData();
}

function getConfig(){
    return {
        msgRate: Number(document.getElementById("msgRate").value) || 60,
        letterRate: Number(document.getElementById("letterRate").value) || 15,
        imgRate: Number(document.getElementById("imgRate").value) || 40,
        maxTime: Number(document.getElementById("maxTime").value) || 5000,
        maxMsgNum: Number(document.getElementById("maxMsgNum").value) || 3,
        wordCards: document.getElementById("wordCard").value.split("\n").filter(item=>item.trim()!="")
    }
}

function randomRate(rate){
    return Math.random() * 100 < rate;
}

function getRandomWord(){
    let cards = getConfig().wordCards;
    if(cards.length === 0) return "暂无话术，请添加字卡";
    return cards[Math.floor(Math.random()*cards.length)];
}

function appendMsg(name,content,isImg=false,isLetter=false,isMe=false){
    chatRecord.push({name,content,isImg,isLetter,isMe});
    saveData();
    renderChat();
}

function renderChat(){
    let box = document.getElementById("chatBox");
    let html = "";
    chatRecord.forEach(item=>{
        if(item.isLetter){
            html += `<div class="letter-item"><strong>${item.name} 发来信件：</strong><br>${item.content}</div>`;
        }else if(item.isImg){
            html += `<div class="msg-item ${item.isMe?'my-msg':'other-msg'}"><strong>${item.name}：</strong><br><img src="${item.content}" style="max-width:200px;"></div>`;
        }else{
            html += `<div class="msg-item ${item.isMe?'my-msg':'other-msg'}"><strong>${item.name}：</strong>${item.content}</div>`;
        }
    });
    box.innerHTML = html;
    box.scrollTop = box.scrollHeight;
}

function clearAllRecord(){
    if(confirm("确定要清空所有聊天记录吗？")){
        chatRecord = [];
        saveData();
        renderChat();
    }
}

function sendText(){
    let val = document.getElementById("sendInput").value.trim();
    if(!val) return;
    appendMsg("我", val, false, false, true);
    document.getElementById("sendInput").value = "";
}

function sendImg(file){
    let fileObj = file.files[0];
    if(!fileObj) return;
    let reader = new FileReader();
    reader.onload = function(e){
        lastImg = e.target.result;
        appendMsg("我", lastImg, true, false, true);
    }
    reader.readAsDataURL(fileObj);
}

function autoSendMsg(){
    let cfg = getConfig();
    if(roleList.length === 0) return;

    roleList.forEach(roleName=>{
        if(!randomRate(cfg.msgRate)) return;
        let sendNum = Math.floor(Math.random() * cfg.maxMsgNum) + 1;
        for(let i=0;i<sendNum;i++){
            setTimeout(()=>{
                if(lastImg && randomRate(cfg.imgRate)){
                    appendMsg(roleName, lastImg, true, false, false);
                }else{
                    appendMsg(roleName, getRandomWord(), false, false, false);
                }
            }, i * 300);
        }
    })

    if(randomRate(cfg.letterRate)){
        let randRole = roleList[Math.floor(Math.random()*roleList.length)];
        appendMsg(randRole, getRandomWord(), false, true, false);
    }
}

function startAutoTalk(){
    let cfg = getConfig();
    let interval = Math.floor(Math.random() * cfg.maxTime) + 1000;
    timer = setTimeout(()=>{
        autoSendMsg();
        startAutoTalk();
    }, interval);
}
</script>
</body>
</html>
